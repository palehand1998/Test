
name: Debug Shutuba

on:
  workflow_dispatch:
    inputs:
      race_id:
        description: "確認する12桁のレースID"
        required: true
        default: "202606050811"
        type: string

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Pythonをセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: ライブラリをインストール
        run: pip install requests beautifulsoup4

      - name: 出馬表を確認
        run: python debug_shutuba.py --race-id "${{ inputs.race_id }}"
