
name: Run Shutuba Fetcher

"on":
  workflow_dispatch:
    inputs:
      race_id:
        description: "対象レースID (12桁)"
        required: true
        default: "202605021211"

permissions:
  contents: write

jobs:
  run-fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install requests beautifulsoup4

      - name: Fetch entry and past results
        run: |
          python fetch_shutuba_with_history.py "${{ inputs.race_id }}" \
            --history 3 \
            --sleep 2.5 \
            --limit-horses 2

      - name: Check generated JSON
        run: |
          python -c "import json; d=json.load(open('data/raw_shutuba_with_history.json', encoding='utf-8')); r=d.get('races', {}).get('${{ inputs.race_id }}'); assert r, '指定レースのデータがありません'; assert isinstance(r.get('horses'), list), 'horsesが配列ではありません'; print('レース:', r.get('name')); print('出走馬:', len(r['horses'])); print('過去成績あり:', sum(bool(h.get('past_results')) for h in r['horses']))"

      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw_shutuba_with_history.json
          if ! git diff --cached --quiet; then
            git commit -m "Update shutuba history for ${{ inputs.race_id }}"
            git push
          else
            echo "変更がないためコミットをスキップします"
          fi
