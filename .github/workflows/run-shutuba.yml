name: Run Shutuba Fetcher
on:
  workflow_dispatch:
    inputs:
      race_id:
        description: '対象レースID (12桁)'
        required: true
        default: '202505021211'

jobs:
  run-fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install requests beautifulsoup4
      - name: Run script
        run: python fetch_shutuba_with_history.py ${{ github.event.inputs.race_id }}
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw_shutuba_with_history.json
          git diff --cached --quiet || git commit -m "Update shutuba history for ${{ github.event.inputs.race_id }}"
          git push
