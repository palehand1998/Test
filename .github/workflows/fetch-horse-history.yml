
name: Fetch Horse History

on:
  workflow_dispatch:
    inputs:
      race_id:
        description: "12桁のレースID"
        required: true
        default: "202608040911"

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install requests beautifulsoup4

      - name: Fetch race entry data
        run: python fetch_shutuba.py "${{ inputs.race_id }}" --sleep 2.5
      - name: Fetch horse history
        run: python fetch_horse_history.py "${{ inputs.race_id }}" --history 3 --sleep 2.5

      - name: Upload history JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: horse-history-data
          path: data/horse_history.json
          if-no-files-found: warn
