
name: Fetch Race Entry Data

on:
  workflow_dispatch:
    inputs:
      race_id:
        description: "12桁のレースID"
        required: true
        default: "202608040911"

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install requests beautifulsoup4

      - name: Fetch race entry data
        run: python fetch_shutuba.py "${{ inputs.race_id }}"

      - name: Upload JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shutuba-data
          path: data/shutuba.json
          if-no-files-found: warn
