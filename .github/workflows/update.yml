name: Auto Update Race Data

on:
  workflow_dispatch:
  # schedule:
  #   - cron: '0 23 * * 5' # 毎週土曜の朝8時(日本時間)に自動実行したい場合はコメントアウトを外す

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: 1. リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: 2. Python環境のセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. 依存ライブラリのインストール
        run: |
          python -m pip install --upgrade pip

      - name: 4. Pythonスクリプトの実行
        run: python update_data.py

      - name: 5. 変更されたJSONファイルを自動でGitHubにコミット・プッシュ
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add race_data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update race data via GitHub Actions" && git push)
