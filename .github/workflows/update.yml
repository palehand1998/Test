name: Auto Update Bulletin Summary

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: 1. リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: 2. Python環境のセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: 3. 依存ライブラリのインストール
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install google-genai

      - name: 4. レース結果の取得
        run: python scrape_results.py --race-id 202505021211

      - name: 5. レース結果JSONの検証
        run: python validate_results.py

      - name: 6. 予想データの生成
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python update_data.py

      - name: 7. JSONファイルを自動コミット
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update race results and bulletin summary"
          file_pattern: "bulletin_summary.json data/raw_race_results.json"
