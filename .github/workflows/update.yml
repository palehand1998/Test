name: Auto Update Bulletin Summary

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: 1. リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: 2. Python環境のセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. 依存ライブラリのインストール
        run: |
          python -m pip install --upgrade pip
          pip install google-genai

      - name: 4. Pythonスクリプトの実行
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python update_data.py

      - name: 5. 変更されたJSONファイルを自動でコミット＆プッシュ
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update bulletin summary via Gemini API"
          file_pattern: bulletin_summary.json
