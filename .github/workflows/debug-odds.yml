
name: Debug Race Odds

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Pythonをセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: 必要なライブラリをインストール
        run: pip install requests beautifulsoup4

      - name: オッズ取得元を調査
        run: python debug_odds.py
