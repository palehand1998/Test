
name: Update Race Results Only

on:
  workflow_dispatch:
    inputs:
      race_id:
        description: "更新するレースID"
        required: true
        default: "202505021211"
        type: string

permissions:
  contents: write

jobs:
  update-results:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Pythonをセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: 必要なライブラリをインストール
        run: pip install requests beautifulsoup4

      - name: 結果データを取得
        run: python scrape_results.py --race-id "${{ inputs.race_id }}"

      - name: 結果JSONを検証
        run: python validate_results.py

      - name: 結果JSONだけをコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw_race_results.json
          if git diff --cached --quiet; then
            echo "変更はありません"
          else
            git commit -m "Update race results only"
            git push
          fi
