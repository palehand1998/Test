
name: Test Standalone Shutuba

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Check Python syntax
        run: python -m py_compile fetch_shutuba.py test_fetch_shutuba.py

      - name: Run parser tests
        run: python -m unittest -v test_fetch_shutuba.py

      - name: Run shared utility tests
        run: python -m unittest -v test_keiba_common.py
