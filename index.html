<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10131c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="指数競馬">
<title>指数競馬 | レース詳細</title>
<style>
:root{
  --bg:#10131c; --panel:#181c28; --panel2:#1f2433; --line:#2a3043;
  --text:#ebe8e2; --mute:#8d93a6; --gold:#d9b45b; --gold-d:#8a7236; --red:#e0685a;
  --r:16px;
  --font:-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);
  -webkit-text-size-adjust:100%;overscroll-behavior-y:none}
body{padding:env(safe-area-inset-top) 0 0;min-height:100vh;min-height:100dvh}
.wrap{max-width:560px;margin:0 auto;padding:12px 14px calc(96px + env(safe-area-inset-bottom))}
h1,h2,h3,p{margin:0}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;padding:6px 2px 12px}
.brand{font-size:15px;font-weight:700;letter-spacing:.04em;color:var(--gold)}
.date{font-size:12px;color:var(--mute)}

/* race select */
.select{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
.select select{appearance:none;-webkit-appearance:none;width:100%;background:transparent;border:0;color:var(--text);
  font:700 22px/1.2 var(--font);padding:16px 48px 16px 18px;border-radius:var(--r);min-height:60px}
.select select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.select::after{content:"";position:absolute;right:20px;top:50%;width:9px;height:9px;margin-top:-7px;
  border-right:2px solid var(--gold);border-bottom:2px solid var(--gold);transform:rotate(45deg);pointer-events:none}
.select option{font-size:17px;background:#fff;color:#000}

/* conditions */
.race-name{margin:18px 2px 10px;font-size:13px;color:var(--mute)}
.race-name b{display:block;font-size:20px;color:var(--text);margin-bottom:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 4px}
.chip{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:7px 13px;font-size:13px;white-space:nowrap}
.chip.main{border-color:var(--gold-d);color:var(--gold);font-weight:700}

/* sections */
section{margin-top:26px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;margin:0 2px 10px}
.sec-h h2{font-size:17px;font-weight:700}
.sec-h span{font-size:12px;color:var(--mute)}

/* ranking */
.rank{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{position:relative;display:grid;grid-template-columns:22px 34px 1fr auto;gap:10px;align-items:center;
  padding:12px 14px;border-top:1px solid var(--line);min-height:62px}
.row:first-child{border-top:0}
.row.top1{background:linear-gradient(90deg,rgba(217,180,91,.12),transparent 70%)}
.mark{font-size:18px;text-align:center;color:var(--gold);font-weight:700}
.mark.dim{color:var(--mute);font-size:13px}
.num{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-weight:800;font-size:16px;
  font-variant-numeric:tabular-nums;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.info{min-width:0}
.hname{font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jk{font-size:12px;color:var(--mute);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:4px;border-radius:2px;background:var(--panel2);margin-top:7px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:2px;background:var(--gold-d);width:0;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.top1 .bar i,.top2 .bar i,.top3 .bar i{background:var(--gold)}
.score{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;text-align:right;line-height:1}
.score small{display:block;font-size:10px;font-weight:500;color:var(--mute);margin-top:4px}

/* analysis */
.analysis{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px 18px 6px}
.analysis .lead{font-size:16px;line-height:1.7;font-weight:600;padding-bottom:14px;border-bottom:1px solid var(--line)}
.a-item{padding:14px 0;border-bottom:1px solid var(--line)}
.a-item:last-child{border-bottom:0}
.a-item h3{font-size:13px;color:var(--gold);margin-bottom:5px}
.a-item p{font-size:14.5px;line-height:1.8;color:#cfccc6}
.a-item.warn h3{color:var(--red)}

/* bets */
.bets{display:grid;gap:12px}
.bet{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.bet.hero{border-color:var(--gold-d);background:linear-gradient(160deg,#232030,var(--panel) 60%)}
.bet-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.bet-t{font-size:17px;font-weight:800}
.badge{font-size:12px;padding:4px 10px;border-radius:999px;background:var(--panel2);color:var(--mute);border:1px solid var(--line)}
.hero .badge{background:var(--gold);color:#241d08;border-color:var(--gold);font-weight:700}
.combos{display:grid;gap:8px}
.combo{display:flex;align-items:center;gap:6px;flex-wrap:wrap;background:var(--panel2);border-radius:12px;padding:9px 10px}
.combo .dash{color:var(--mute);font-size:12px}
.combo .n{width:30px;height:30px;font-size:14px;border-radius:8px}
.combo .amt{margin-left:auto;font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
.bet-note{font-size:13px;color:var(--mute);line-height:1.7;margin-top:11px}

.summary{display:flex;justify-content:space-between;align-items:center;margin-top:14px;padding:16px 18px;
  border-radius:var(--r);background:var(--panel2);border:1px dashed var(--gold-d)}
.summary span{font-size:13px;color:var(--mute)}
.summary b{font-size:22px;font-variant-numeric:tabular-nums}
.disc{margin-top:22px;font-size:11px;line-height:1.7;color:var(--mute);text-align:center;padding:0 10px}

/* ===== 補助情報（掲示板・世論）: 本編と別トーンのスレート系・破線 ===== */
.aux{margin-top:40px;padding-top:26px;border-top:1px dashed var(--line)}
.aux-card{--sl:#93a8bf;--sl-d:#5d6d82;--sl-line:#343d50;--sl-bg:#131824;
  background:var(--sl-bg);border:1.5px dashed var(--sl-line);border-radius:14px;color:#c4cbd6}
.aux-card summary{list-style:none;cursor:pointer;position:relative;padding:16px 46px 16px 16px;min-height:56px}
.aux-card summary::-webkit-details-marker{display:none}
.aux-card summary:focus-visible{outline:2px solid var(--sl);outline-offset:2px;border-radius:14px}
.aux-top{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.aux-tag{font-size:11px;font-weight:700;color:var(--sl);border:1px solid var(--sl-d);border-radius:6px;padding:2px 8px}
.aux-meta{font-size:11px;color:var(--sl-d)}
.aux-card h2{font-size:16px;font-weight:700;color:#d5dbe5}
.aux-note{font-size:12px;line-height:1.6;color:var(--sl);margin-top:6px}
.aux-card summary::after{content:"";position:absolute;right:20px;top:26px;width:9px;height:9px;
  border-right:2px solid var(--sl);border-bottom:2px solid var(--sl);transform:rotate(45deg);transition:transform .2s}
.aux-card[open] summary::after{transform:rotate(-135deg);top:30px}
.aux-body{padding:2px 16px 16px;border-top:1px dashed var(--sl-line)}
.aux-h{font-size:13px;font-weight:700;color:var(--sl);margin:18px 0 10px}
.aux .num{width:26px;height:26px;font-size:13px;border-radius:7px;opacity:.9}
.dk{display:grid;grid-template-columns:26px 1fr;gap:10px;padding:11px 0;border-top:1px dotted var(--sl-line)}
.dk:first-of-type{border-top:0}
.dk-n{font-size:14px;font-weight:700;color:#d5dbe5}
.dk-n em{font-style:normal;font-size:11px;font-weight:500;color:var(--sl);margin-left:8px;border:1px solid var(--sl-line);border-radius:5px;padding:1px 6px}
.dk p{font-size:13.5px;line-height:1.7;margin-top:3px}
.heat{display:block;font-size:11px;color:var(--sl-d);margin-top:5px;letter-spacing:.1em}
.heat b{color:var(--sl);font-weight:400}
.trend{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px}
.trend span{text-align:center;font-size:12.5px;padding:8px 0;border:1px dashed var(--sl-line);border-radius:8px;color:var(--sl-d)}
.trend span.on{border-style:solid;border-color:var(--sl);color:#e1e6ee;font-weight:700;background:rgba(147,168,191,.12)}
.gn{display:grid;grid-template-columns:62px 1fr;gap:8px;padding:8px 0;font-size:13.5px;line-height:1.65}
.gn time{font-size:11.5px;color:var(--sl-d);padding-top:2px}
.vw{border-left:2px dashed var(--sl-d);padding:2px 0 2px 12px;margin:0 0 12px}
.vw p{font-size:13.5px;line-height:1.7}
.vw div{margin-top:5px;font-size:11.5px;color:var(--sl-d)}
.vw div b{color:var(--sl);font-weight:600;margin-right:8px}
.aux-foot{font-size:11px;line-height:1.7;color:var(--sl-d);margin-top:6px}

/* account / status / memo */
.acct{position:relative}
.acct select{appearance:none;-webkit-appearance:none;background:var(--panel);border:1px solid var(--line);color:var(--text);
  font:700 14px var(--font);padding:0 32px 0 14px;border-radius:999px;min-height:42px;max-width:160px}
.acct select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.acct::after{content:"";position:absolute;right:13px;top:50%;width:7px;height:7px;margin-top:-6px;
  border-right:2px solid var(--gold);border-bottom:2px solid var(--gold);transform:rotate(45deg);pointer-events:none}
.status{display:flex;align-items:center;gap:10px;margin:0 0 14px;padding:12px 14px;border-radius:12px;font-size:13px;line-height:1.6}
.status[hidden],#main[hidden]{display:none}
.status.load{justify-content:center;padding:36px 14px;background:var(--panel);border:1px solid var(--line);color:var(--mute)}
.status.warn{background:rgba(224,104,90,.1);border:1px solid rgba(224,104,90,.4);color:#f0b3ab}
.status .retry{margin-left:auto;flex:none;height:38px;padding:0 14px;border-radius:10px;border:1px solid currentColor;
  background:transparent;color:inherit;font:700 13px var(--font);cursor:pointer}
.spin{width:18px;height:18px;border:2px solid var(--line);border-top-color:var(--gold);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.memo{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.memo-who{font-size:13px;color:var(--mute);margin-bottom:10px}
.memo-who b{color:var(--gold);font-size:15px}
.memo textarea{display:block;width:100%;min-height:140px;resize:vertical;background:var(--panel2);border:1px solid var(--line);
  border-radius:12px;color:var(--text);font:16px/1.7 var(--font);padding:12px}
.memo textarea:focus{outline:2px solid var(--gold);outline-offset:1px}
.memo-f{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px}
.memo-st{font-size:12px;color:var(--mute)}
.memo-st.dirty{color:var(--gold)}
.memo .btn{height:46px;padding:0 24px}

/* bottom bar */
.bar-b{position:fixed;left:0;right:0;bottom:0;z-index:5;padding:10px 14px calc(10px + env(safe-area-inset-bottom));
  background:rgba(16,19,28,.88);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.bar-b div{max-width:560px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{height:52px;border-radius:14px;border:1px solid var(--line);background:var(--panel2);color:var(--text);
  font:700 16px var(--font);cursor:pointer}
.btn.pri{background:var(--gold);color:#241d08;border-color:var(--gold)}
.btn:active{transform:scale(.98)}
.btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;
  background:var(--text);color:#111;padding:11px 18px;border-radius:999px;font-size:14px;font-weight:700;
  transition:.25s;pointer-events:none;z-index:9;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:360px){.score{font-size:21px}.hname{font-size:15px}.select select{font-size:19px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><div><div class="brand">指数競馬</div><div class="date" id="today"></div></div>
    <label class="acct"><select id="acctSel" aria-label="アカウントを切り替え"></select></label></div>

  <div id="status" class="status load" role="status"><div class="spin"></div><span>レースデータを読み込み中…</span></div>

  <div id="main" hidden>
  <label class="select" aria-label="レースを選択">
    <select id="raceSel"></select>
  </label>

  <div class="race-name" id="raceName"></div>
  <div class="chips" id="conds"></div>

  <section>
    <div class="sec-h"><h2>予想指数ランキング</h2><span id="fieldCount"></span></div>
    <div class="rank" id="rank"></div>
  </section>

  <section>
    <div class="sec-h"><h2>レース分析</h2><span>AI解析</span></div>
    <div class="analysis" id="analysis"></div>
  </section>

  <section>
    <div class="sec-h"><h2>推奨買い目</h2><span id="betCount"></span></div>
    <div class="bets" id="bets"></div>
    <div class="summary"><span>推奨購入額の合計</span><b id="total"></b></div>
  </section>

  <section>
    <div class="sec-h"><h2>マイメモ</h2><span>この端末に保存</span></div>
    <div class="memo">
      <div class="memo-who" id="memoWho"></div>
      <textarea id="memoText" placeholder="このレースの狙い・気づきをメモ" aria-label="レースメモ"></textarea>
      <div class="memo-f"><span class="memo-st" id="memoSt"></span><button class="btn pri" id="memoSave" type="button">メモを保存</button></div>
    </div>
  </section>

  <section class="aux" aria-label="補助情報">
    <details class="aux-card" id="aux">
      <summary>
        <div class="aux-top"><span class="aux-tag">参考情報</span><span class="aux-meta" id="auxMeta"></span></div>
        <h2>掲示板・世論のまとめ</h2>
        <p class="aux-note">※みんなの掲示板・SNSの意見をAIが要約（参考情報）。予想指数・推奨買い目には反映されていません。</p>
      </summary>
      <div class="aux-body" id="auxBody"></div>
    </details>
  </section>

  <p class="disc">指数・買い目・掲示板まとめはモックデータによる表示例です。掲示板の意見は根拠が不確かな場合があります。馬券は20歳になってから。購入は自己責任でお願いします。</p>
  </div>
</div>

<div class="bar-b"><div>
  <button class="btn" id="shareBtn" type="button">買い目をコピー</button>
  <button class="btn pri" id="nextBtn" type="button">次のレースへ</button>
</div></div>
<div class="toast" id="toast" role="status"></div>

<script>
/* ===== モックデータ（全て架空） ===== */
const FALLBACK_RACES = [
  {
    id:"tokyo11", label:"東京11R", name:"秋晴ステークス", grade:"G2", start:"15:45",
    cond:{surface:"芝",dist:1600,going:"良",weather:"晴",course:"左回り",field:10,cls:"3歳以上オープン"},
    horses:[
      {n:4,name:"ソラノカケラ",jk:"ルメール",s:94.2},
      {n:7,name:"ミッドナイトアリア",jk:"川田将雅",s:91.8},
      {n:2,name:"ブリリアントロード",jk:"戸崎圭太",s:88.5},
      {n:9,name:"キングズレガシー",jk:"横山武史",s:84.1},
      {n:5,name:"ハルカゼノユメ",jk:"坂井瑠星",s:79.6},
      {n:1,name:"ローズクォーツ",jk:"松山弘平",s:74.3},
      {n:10,name:"サンライズバレット",jk:"岩田望来",s:70.9},
      {n:3,name:"アサヒノマイ",jk:"津村明秀",s:66.2},
      {n:8,name:"テンカイチバン",jk:"丹内祐次",s:61.7},
      {n:6,name:"グレイスフルムーン",jk:"菅原明良",s:57.4}
    ],
    lead:"先行力と上がり性能を兼ね備えた④ソラノカケラが指数トップ。②③を相手に、堅実な馬連・3連複中心の構成を推奨します。",
    notes:[
      ["展開予想","逃げ候補は⑨キングズレガシーと⑤ハルカゼノユメ。前半600mは34秒台前半の平均ペースと予測し、先行〜好位で運べる馬に有利な流れです。"],
      ["注目馬","④ソラノカケラは直近3走すべて上がり3F上位。東京芝1600mの実績も高く、安定感は今回のメンバーで頭ひとつ抜けています。⑦ミッドナイトアリアは外枠から末脚を伸ばすタイプで、展開次第では逆転も。"],
      ["馬場傾向","良馬場で内外の差は小さく、直線で馬群がばらければ外差しも届く状態です。"],
      ["懸念点","②ブリリアントロードは休み明け初戦で仕上がりに不安が残ります。⑨は前走で逃げて消耗しており、評価を一段下げました。",1]
    ],
    bets:[
      {type:"馬連",tag:"本線",hero:1,combos:[[4,7,1500],[4,2,1000]],note:"指数上位3頭の組み合わせ。④を軸に、②⑦へ厚めに配分します。"},
      {type:"ワイド",tag:"保険",combos:[[4,9,800],[7,2,700]],note:"的中率を高めるための押さえ。人気薄の⑨が絡むと妙味が出ます。"},
      {type:"3連複",tag:"妙味",combos:[[4,7,2,600],[4,7,9,400],[4,2,5,300]],note:"上位3頭の3連複を軸に、④⑦から⑨・⑤へ流して配当を狙います。"}
    ]
  },
  {
    id:"nakayama11", label:"中山11R", name:"アルカディアカップ", grade:"G3", start:"15:25",
    cond:{surface:"芝",dist:2000,going:"稍重",weather:"曇",course:"右回り",field:9,cls:"3歳以上オープン"},
    horses:[
      {n:6,name:"ストームブレイカー",jk:"武豊",s:92.6},
      {n:3,name:"ヴェールオブナイト",jk:"レーン",s:89.4},
      {n:8,name:"カゼノトビラ",jk:"田辺裕信",s:85.7},
      {n:1,name:"ゴールデンシーズン",jk:"福永祐一",s:80.2},
      {n:5,name:"アイボリーコースト",jk:"石橋脩",s:76.8},
      {n:9,name:"ナナイロノウタ",jk:"三浦皇成",s:71.5},
      {n:2,name:"ブルームフィールド",jk:"木幡巧也",s:65.9},
      {n:7,name:"ペルセウスノヒカリ",jk:"丸山元気",s:62.3},
      {n:4,name:"ミナモノツキ",jk:"鮫島克駿",s:58.0}
    ],
    lead:"稍重の中山2000mはタフな持久力勝負。スタミナ指数で上回る⑥ストームブレイカーを中心視します。",
    notes:[
      ["展開予想","内回りでコーナー6回の設計。ペースが落ち着けば先行勢が残りやすく、③⑧の好位勢に注意が必要です。"],
      ["注目馬","⑥は道悪実績が豊富で、重馬場のレースで連対を外していません。③は鋭い瞬発力が武器ですが、馬場が渋ると少し割引です。"],
      ["馬場傾向","雨の影響で内側がやや荒れ気味。3〜4コーナーで外を回しても差は詰められる状態です。"],
      ["懸念点","⑧カゼノトビラは右回りでの勝ち鞍がなく、コース替わりが課題。",1]
    ],

function renderBuzz(r, sorted){

    $("auxMeta").textContent = "データなし";
    $("auxBody").innerHTML = `<p class="aux-foot" style="margin-top:14px">このレースの掲示板まとめは取得できていません。</p>`;
    return;

  const nm = n => r.horses.find(h => h.n === n).name;

    `<h3 class="aux-h">注目されている穴馬の噂</h3>` +

      <span class="heat">話題度 <b>${"●".repeat(d.heat)}</b>${"○".repeat(5-d.heat)}</span></div></div>`).join("") +
    `<h3 class="aux-h">馬場状態のリアルタイムの気配</h3>
     <div class="trend">${TREND.map((t,k) => `<span class="${k===b.trend?"on":""}">${t}</span>`).join("")}</div>` +
    b.going.map(([t,x]) => `<div class="gn"><time>${t}</time><span>${x}</span></div>`).join("") +

/* ===== 枠色（JRA基準） ===== */
const GATE = [
  {bg:"#f4f4f2",fg:"#111"},{bg:"#1a1a1a",fg:"#fff"},{bg:"#d6362f",fg:"#fff"},{bg:"#2e6fd1",fg:"#fff"},
  {bg:"#f2cf2e",fg:"#111"},{bg:"#2f9a4e",fg:"#fff"},{bg:"#ee8a1d",fg:"#111"},{bg:"#ee86b4",fg:"#111"}
];
function gateOf(num,total){
  if(total<=8) return num-1;
  const single = 16-total;
  return num<=single ? num-1 : single + Math.ceil((num-single)/2) - 1;
}
const MARKS = ["◎","○","▲","△","☆"];
const $ = id => document.getElementById(id);
const yen = v => "¥" + v.toLocaleString("ja-JP");

let cur = 0;

function numBadge(n,total,cls){
  const g = GATE[Math.min(7,gateOf(n,total))];
  return `<span class="num ${cls||""}" style="background:${g.bg};color:${g.fg}">${n}</span>`;
}

function render(i){
  flushMemo();
  cur = i;
  const r = RACES[i], c = r.cond, total = c.field;
  $("raceName").innerHTML = `<b>${r.name}（${r.grade}）</b>発走 ${r.start}`;
  $("conds").innerHTML = [
    [`${c.surface}${c.dist}m`,1],[`${c.going}馬場`,1],[c.weather],[c.course],[`${c.field}頭立て`],[c.cls]
  ].map(([t,m]) => `<span class="chip${m?" main":""}">${t}</span>`).join("");

  const sorted = [...r.horses].sort((a,b) => b.s - a.s);
  const max = sorted[0].s;
  $("fieldCount").textContent = `${sorted.length}頭を表示`;
  $("rank").innerHTML = sorted.map((h,k) => `
    <div class="row${k<3?` top${k+1}`:""}">
      <div class="mark${k>4?" dim":""}">${MARKS[k]||k+1}</div>
      ${numBadge(h.n,total)}
      <div class="info">
        <div class="hname">${h.name}</div>
        <div class="jk">${h.jk}騎手</div>
        <div class="bar"><i data-w="${(h.s/max*100).toFixed(1)}"></i></div>
      </div>
      <div class="score">${h.s.toFixed(1)}<small>指数</small></div>
    </div>`).join("");
  requestAnimationFrame(() => requestAnimationFrame(() =>
    document.querySelectorAll(".bar i").forEach(e => e.style.width = e.dataset.w + "%")));

  $("analysis").innerHTML =
    `<p class="lead">${r.lead}</p>` +
    r.notes.map(([t,p,w]) => `<div class="a-item${w?" warn":""}"><h3>${t}</h3><p>${p}</p></div>`).join("");

  let sum = 0, pts = 0;
  $("betCount").textContent = `${r.bets.length}券種`;
  $("bets").innerHTML = r.bets.map(b => {
    const rows = b.combos.map(cb => {
      const amt = cb[cb.length-1], nums = cb.slice(0,-1);
      sum += amt; pts++;
      return `<div class="combo">${nums.map((n,k) =>
        (k?'<span class="dash">－</span>':'') + numBadge(n,total,"n")).join("")}
        <span class="amt">${yen(amt)}</span></div>`;
    }).join("");
    return `<div class="bet${b.hero?" hero":""}">
      <div class="bet-h"><span class="bet-t">${b.type}</span><span class="badge">${b.tag}</span></div>
      <div class="combos">${rows}</div><p class="bet-note">${b.note}</p></div>`;
  }).join("");
  $("total").textContent = `${yen(sum)}（${pts}点）`;
  renderBuzz(r, sorted);
  loadMemo();
  try{ localStorage.setItem("lastRace", r.id); }catch(e){}
}

function toast(msg){
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("show"), 1800);
}

function betText(){
  const r = RACES[cur];
  const lines = [`${r.label} ${r.name}`];
  r.bets.forEach(b => b.combos.forEach(cb => {
    lines.push(`${b.type} ${cb.slice(0,-1).join("-")}  ${yen(cb[cb.length-1])}`);
  }));
  return lines.join("\n");
}

/* ===== 外部データ読み込み ===== */
let RACES = [], BUZZ = {}, usingFallback = false;
async function getJSON(url){
  const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 8000);
  try{
    const res = await fetch(url, {cache:"no-cache", signal:ctl.signal});
    if(!res.ok) throw new Error("HTTP " + res.status);
    return await res.json();
  } finally { clearTimeout(t); }
}
const TR = {inside:0, flat:1, outside:2};
function normRaces(j){
  if(!j || !Array.isArray(j.races) || !j.races.length) throw new Error("races が空です");
  return j.races.map(r => {
    const c = r.condition || {}, hs = r.horses || [], a = r.analysis || {};
    if(!r.id || !hs.length) throw new Error("race.id / horses が不正です");
    return {
      id:r.id, label:r.label || r.id, name:r.name || "", grade:r.grade || "", start:r.start_time || "",
      cond:{surface:c.surface || "", dist:c.distance || "", going:c.going || "", weather:c.weather || "-",
            course:c.course || "", field:c.field_size || hs.length, cls:c.class || ""},
      horses:hs.map(h => ({n:h.num, name:h.name, jk:h.jockey, s:h.score})),
      lead:a.summary || "",
      notes:(a.points || []).map(p => [p.title, p.text, p.warn ? 1 : 0]),
      bets:(r.bets || []).map(b => ({type:b.type, tag:b.tag || "", hero:b.hero ? 1 : 0, note:b.note || "",
            combos:(b.combos || []).map(x => [...x.nums, x.amount])}))
    };
  });
}
function normBuzz(j){
  if(!j || !Array.isArray(j.summaries)) throw new Error("summaries がありません");
  const out = {};
  j.summaries.forEach(s => {
    const g = s.going || {};
    out[s.race_id] = {
      meta:`${s.updated_at || ""}更新・約${(s.post_count || 0).toLocaleString("ja-JP")}件を要約`,
      dark:(s.dark_horses || []).map(d => ({n:d.num, txt:d.comment, heat:Math.max(1, Math.min(5, d.heat || 1))})),
      trend:TR[g.trend] ?? 1,
      going:(g.reports || []).map(x => [x.time, x.text]),
      views:(s.views || []).map(v => [v.tag, v.text, v.likes || 0])
    };
  });
  return out;
}

function setStatus(kind, msg){
  const s = $("status");
  if(!kind){ s.hidden = true; return; }
  s.hidden = false; s.className = "status " + kind;
  s.innerHTML = kind === "load" ? `<div class="spin"></div><span>${msg}</span>`
    : `<span>${msg}</span><button type="button" class="retry" id="retryBtn">再読み込み</button>`;
  const b = $("retryBtn"); if(b) b.onclick = loadAll;
}

async function loadAll(){
  setStatus("load", "レースデータを読み込み中…");
  const keepId = RACES[cur] && RACES[cur].id;
  const [rr, bb] = await Promise.allSettled([getJSON("race_data.json"), getJSON("bulletin_summary.json")]);
  let buzzFailed = false;
  try{
    if(rr.status !== "fulfilled") throw rr.reason;
    RACES = normRaces(rr.value); usingFallback = false;
  }catch(e){ console.warn("race_data.json:", e); RACES = FALLBACK_RACES; usingFallback = true; }
  try{
    if(bb.status !== "fulfilled") throw bb.reason;
    BUZZ = normBuzz(bb.value);
  }catch(e){ console.warn("bulletin_summary.json:", e); buzzFailed = true; BUZZ = usingFallback ? FALLBACK_BUZZ : {}; }

  let last = keepId; 
  try{ last = last || localStorage.getItem("lastRace"); }catch(e){}
  const idx = Math.max(0, RACES.findIndex(r => r.id === last));
  sel.innerHTML = RACES.map((r,k) => `<option value="${k}">${r.label}　${r.name}</option>`).join("");
  sel.value = idx;
  $("main").hidden = false;
  render(idx);

  if(usingFallback) setStatus("warn", "race_data.json を読み込めませんでした。内蔵のサンプルデータを表示しています。");
  else if(buzzFailed) setStatus("warn", "掲示板まとめ（bulletin_summary.json）を取得できませんでした。レース情報は最新です。");
  else setStatus(null);
}

/* ===== アカウント & メモ ===== */
const ACCOUNTS = ["アレハンドロ","カワブン","カホ","ウルゲン"];
let account = ACCOUNTS[0];
try{ const a = localStorage.getItem("account"); if(ACCOUNTS.includes(a)) account = a; }catch(e){}

let memoCtx = null, memoDirty = false;
const memoKey = (a, id) => `memo:${a}:${id}`;
function memoState(t, dirty){ const e = $("memoSt"); e.textContent = t; e.className = "memo-st" + (dirty ? " dirty" : ""); }
function writeMemo(ctx){
  const v = $("memoText").value;
  try{
    if(v.trim()) localStorage.setItem(memoKey(ctx.a, ctx.id), v);
    else localStorage.removeItem(memoKey(ctx.a, ctx.id));
    return true;
  }catch(e){ return false; }
}
function flushMemo(){            // 切り替え前に未保存の変更を元の組み合わせへ自動保存
  if(!memoCtx || !memoDirty) return;
  if(writeMemo(memoCtx)) memoDirty = false;
}
function loadMemo(){
  const r = RACES[cur]; memoCtx = {a:account, id:r.id};
  let v = ""; try{ v = localStorage.getItem(memoKey(account, r.id)) || ""; }catch(e){}
  $("memoText").value = v; memoDirty = false;
  $("memoWho").innerHTML = `<b>${account}</b> のメモ ／ ${r.label} ${r.name}`;
  memoState(v ? "保存済み" : "未入力", false);
}

const sel = $("raceSel"), acSel = $("acctSel");

acSel.value = account;
acSel.addEventListener("change", () => {
  flushMemo(); account = acSel.value;
  try{ localStorage.setItem("account", account); }catch(e){}
  if(RACES.length) loadMemo();
  toast(`${account} に切り替えました`);
});
sel.addEventListener("change", () => { render(+sel.value); window.scrollTo({top:0,behavior:"smooth"}); });
$("nextBtn").addEventListener("click", () => {
  const n = (cur + 1) % RACES.length;
  sel.value = n; render(n); window.scrollTo({top:0,behavior:"smooth"});
});
$("shareBtn").addEventListener("click", async () => {
  const text = betText();
  try{
    if(navigator.clipboard && window.isSecureContext){ await navigator.clipboard.writeText(text); }
    else{
      const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta);
      ta.select(); document.execCommand("copy"); ta.remove();
    }
    toast("買い目をコピーしました");
  }catch(e){ toast("コピーできませんでした"); }
});
$("memoText").addEventListener("input", () => { memoDirty = true; memoState("未保存の変更があります", true); });
$("memoSave").addEventListener("click", () => {
  if(!memoCtx) return;
  if(writeMemo(memoCtx)){ memoDirty = false; memoState($("memoText").value.trim() ? "保存済み" : "未入力", false); toast("メモを保存しました"); }
  else toast("保存できませんでした");
});
document.addEventListener("visibilitychange", () => { if(document.hidden) flushMemo(); });
window.addEventListener("pagehide", flushMemo);

const d = new Date();
$("today").textContent = `${d.getMonth()+1}月${d.getDate()}日（${"日月火水木金土"[d.getDay()]}）`;
loadAll();
